name: aiblame
description: >-
  How much of this repository was written with AI? Reports AI authorship from
  git trailers and agent identities, writes a job summary, an optional
  shields.io badge file, and can fail the job on a disclosure policy.
author: trinhbentre
branding:
  icon: git-commit
  color: purple

inputs:
  version:
    description: aiblame release tag to use (e.g. v1.0.0) or "latest".
    default: latest
  path:
    description: Repository path to analyse.
    default: "."
  args:
    description: Extra flags passed to `aiblame stats` (e.g. "--since 2026-01-01 --no-blame").
    default: ""
  summary:
    description: Append a Markdown report to the job summary.
    default: "true"
  badge-path:
    description: If set, write a shields.io endpoint JSON here (commit or publish it and use img.shields.io/endpoint).
    default: ""
  badge-color:
    description: Badge colour (hex, shields name, or "auto").
    default: "7c3aed"
  check-args:
    description: >-
      If set, run `aiblame check` with these flags and fail the job when a rule
      fails (e.g. "--max 60 --require-trailer assisted-by" or "--policy kernel").
    default: ""
  pr-range:
    description: >-
      On pull_request events, analyse only the PR's commits
      (--rev origin/<base>..HEAD) so the report and the check describe this
      change rather than the whole repository.
    default: "false"
  pr-comment:
    description: >-
      On pull_request events, post (or update) a comment on the PR with the
      Markdown report. Needs `permissions: pull-requests: write`.
    default: "false"

outputs:
  ai-share:
    description: Headline AI share in percent (surviving lines, or lines added with --no-blame).
    value: ${{ steps.report.outputs.ai-share }}
  report:
    description: Path to the JSON report.
    value: ${{ steps.report.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install aiblame
      shell: bash
      env:
        AIBLAME_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "unsupported OS $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported arch $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/aiblame-bin"
        mkdir -p "$dir"
        if [ "$AIBLAME_VERSION" = "latest" ]; then
          base="https://github.com/trinhbentre/aiblame/releases/latest/download"
        else
          base="https://github.com/trinhbentre/aiblame/releases/download/$AIBLAME_VERSION"
        fi
        if [ "$os" = windows ]; then
          curl -fsSL "$base/aiblame_${os}_${arch}.zip" -o "$dir/aiblame.zip"
          (cd "$dir" && unzip -oq aiblame.zip && mv "aiblame_${os}_${arch}.exe" aiblame.exe)
        else
          curl -fsSL "$base/aiblame_${os}_${arch}.tar.gz" | tar -xz -C "$dir"
          mv "$dir/aiblame_${os}_${arch}" "$dir/aiblame"
          chmod +x "$dir/aiblame"
        fi
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/aiblame" version

    - name: Warn on shallow clone
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::Shallow clone detected; use actions/checkout with fetch-depth: 0 so aiblame can see the full history."
        fi

    # Inputs are passed through `env:` and expanded by the shell, never
    # interpolated into the script text, so they cannot inject commands.
    - name: Resolve PR range
      id: range
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        AIBLAME_PR_RANGE: ${{ inputs.pr-range }}
        AIBLAME_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        range=""
        if [ "$AIBLAME_PR_RANGE" = "true" ] && [ -n "$AIBLAME_BASE_REF" ]; then
          git fetch --quiet origin -- "$AIBLAME_BASE_REF" || true
          range="--rev origin/$AIBLAME_BASE_REF..HEAD"
          echo "Analysing only this pull request: $range"
        fi
        echo "flag=$range" >> "$GITHUB_OUTPUT"

    - name: Report
      id: report
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        AIBLAME_ARGS: ${{ inputs.args }}
        AIBLAME_RANGE: ${{ steps.range.outputs.flag }}
        AIBLAME_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/aiblame-report.json"
        md="$RUNNER_TEMP/aiblame-report.md"
        # shellcheck disable=SC2086
        aiblame stats . --json --quiet $AIBLAME_RANGE $AIBLAME_ARGS > "$report"
        share=$(jq -r '.headline_ai_share' "$report")
        printf 'ai-share=%.1f\n' "$share" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "markdown=$md" >> "$GITHUB_OUTPUT"
        echo "AI share: ${share}%"
        # shellcheck disable=SC2086
        aiblame stats . -f md --quiet $AIBLAME_RANGE $AIBLAME_ARGS > "$md"
        if [ "$AIBLAME_SUMMARY" = "true" ]; then
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on the pull request
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GH_TOKEN: ${{ github.token }}
        AIBLAME_MD: ${{ steps.report.outputs.markdown }}
        AIBLAME_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker="<!-- aiblame-report -->"
        { echo "$marker"; cat "$AIBLAME_MD"; } > "$RUNNER_TEMP/aiblame-comment.md"
        # Update the previous aiblame comment when there is one, else create it.
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$AIBLAME_PR/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id" 2>/dev/null || true)
        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/aiblame-comment.md" > /dev/null
        else
          gh pr comment "$AIBLAME_PR" --body-file "$RUNNER_TEMP/aiblame-comment.md"
        fi

    - name: Badge
      if: inputs.badge-path != ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        AIBLAME_ARGS: ${{ inputs.args }}
        AIBLAME_BADGE_PATH: ${{ inputs.badge-path }}
        AIBLAME_BADGE_COLOR: ${{ inputs.badge-color }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        aiblame badge . --quiet --shields "$AIBLAME_BADGE_PATH" --color "$AIBLAME_BADGE_COLOR" $AIBLAME_ARGS

    - name: Policy check
      if: inputs.check-args != ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        AIBLAME_CHECK_ARGS: ${{ inputs.check-args }}
        AIBLAME_RANGE: ${{ steps.range.outputs.flag }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        aiblame check . --no-color --quiet $AIBLAME_RANGE $AIBLAME_CHECK_ARGS
